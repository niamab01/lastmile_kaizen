[project]
name = "lastmile-kaizen"
version = "0.1.0"
description = "Process-improvement analytics on the Amazon Last Mile Routing Research Challenge dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "ijson>=3.2",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
lastmile = "lastmile_kaizen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastmile_kaizen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

